[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funasr-realtime"
version = "0.2.0"
description = "FunASR browser and CLI speech recognition"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "funasr>=1.0.27",
  "numpy>=1.23.0",
  "soundfile>=0.12.1",
  "torch>=2.1.0",
  "torchaudio>=2.1.0",
]

[project.optional-dependencies]
cli = ["sounddevice>=0.4.6"]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
